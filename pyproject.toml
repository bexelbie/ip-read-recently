[project]
name = "ip-read-recently"
version = "0.1.0"
description = "Pull Instapaper bookmarks and highlights into a Markdown reading-list draft"
authors = [
    { name = "Brian (bex) Exelbierd", email = "bex@bexelbie.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "instapyper>=0.0.3",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ip-read-recently = "ip_read_recently.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
